<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Lemon 馬拉松指揮艙 - 強力除錯版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { background: #0B0B0C; color: #F5F5F7; font-family: sans-serif; padding: 20px; }
        .card { background: #16161A; padding: 20px; border-radius: 12px; border: 1px solid #2C2C35; margin-bottom: 20px; }
        .btn { background: #333; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; margin: 5px; }
        .btn.active { background: #FF5200; }
        .debug { color: yellow; font-size: 0.8rem; }
    </style>
</head>
<body>
    <h1>Lemon 馬拉松指揮艙</h1>
    <div class="card">
        <h2>📅 週期化課表探索</h2>
        <div id="month-nav">載入中...</div>
        <div id="week-nav"></div>
        <div id="plans-content"></div>
    </div>

    <script>
        const PLAN_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRJAGuKrOQuxjDzHvyy9upf0636fKJIy7X3JFGzMquA9x7y6URIaGCv0wqhGObgp364nY9YCuuX6udn/pub?gid=184866247&single=true&output=csv";
        let planData = [];

        Papa.parse(PLAN_URL, {
            download: true, header: true,
            complete: (results) => {
                planData = results.data;
                // [DEBUG] 顯示抓到的第一筆資料，用來檢查欄位名稱是否正確
                console.log("資料格式:", planData[0]);
                if(planData.length > 0) {
                    let keys = Object.keys(planData[0]);
                    document.getElementById('month-nav').innerHTML = "偵測到欄位: " + keys.join(', ') + "<br>" + 
                    [...new Set(planData.map(r => r.月份))].map(m => `<button class="btn" onclick="selectMonth('${m}', this)">${m}</button>`).join('');
                }
            }
        });

        function selectMonth(m, btn) {
            document.querySelectorAll('#month-nav .btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // 重要：這裡檢查欄位是否真的叫 "月份" 和 "週期週數"
            let weeks = [...new Set(planData.filter(r => r.月份 == m).map(r => r.週期週數))].filter(w => w);
            
            document.getElementById('week-nav').innerHTML = weeks.map(w => 
                `<button class="btn" onclick="renderPlan('${m}', '${w}', this)">${w}</button>`).join('');
            
            if(weeks.length === 0) document.getElementById('week-nav').innerHTML = "找不到該月週次，請檢查 Excel 欄位名稱";
        }

        function renderPlan(m, w, btn) {
            document.querySelectorAll('#week-nav .btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            let filtered = planData.filter(r => r.月份 == m && r.週期週數 == w);
            
            let html = '<table><thead><tr><th>星期</th><th>內容</th></tr></thead><tbody>';
            filtered.forEach(r => html += `<tr><td>${r.星期}</td><td>${r.精確課表內容與跑錶設定參數}</td></tr>`);
            document.getElementById('plans-content').innerHTML = html + '</tbody></table>';
        }
    </script>
</body>
</html>
