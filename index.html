<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lemon 數據艙</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { background: #0B0B0C; color: white; font-family: sans-serif; padding: 20px; }
        .card { background: #16161A; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Lemon 數據指揮艙</h1>
    <div id="app" class="card">資料載入中...</div>

    <script>
        // 這裡貼上你剛剛在 Google Sheets 發佈得到的 CSV 連結！
        const CSV_URL = "你的 Google Sheets 發佈 CSV 連結貼在這裡"; 

        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            complete: function(results) {
                console.log("資料成功載入:", results.data);
                document.getElementById('app').innerHTML = "資料已同步！現在你可以開始設計你的顯示表格了。";
            }
        });
    </script>
</body>
</html>
