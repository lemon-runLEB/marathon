<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Lemon Marathon Command</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --bg: #050505; --card: #121212; --primary: #FF4500; --actual: #00E676; --tier-a: #FF0055; --tier-b: #FFB300; --text: #FFFFFF; --sub: #A0A0A0; --border: #222222; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; padding: 20px; }
        .nav { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; }
        .btn { background: #1C1C1C; color: var(--sub); border: 1px solid var(--border); padding: 12px 20px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .sub-nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 0; padding: 10px; background: #0D0D0D; border-radius: 8px; border: 1px solid #1A1A1A; }
        .panel { display: none; }
        .panel.active { display: block; }
        .card { background: var(--card); padding: 25px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 20px; }
        
        .strategy { border-left: 4px solid var(--primary); padding: 12px 20px; background: #1A1A1A; color: #EEEEEE; border-radius: 0 8px 8px 0; font-size: 0.95rem; }
        .strategy h3 { margin-top: 0; color: var(--primary); font-size: 1rem; margin-bottom: 5px; }
        
        .table-container { width: 100%; overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { font-size: 0.85rem; text-transform: uppercase; padding: 14px 12px; border-bottom: 2px solid #333; text-align: left; background: #16161A; }
        .th-expected { color: var(--primary); border-top: 2px solid var(--primary); }
        .th-actual { color: var(--actual); border-top: 2px solid var(--actual); background: #0A1A10; }
        
        td { padding: 15px 12px; border-bottom: 1px solid var(--border); font-size: 0.9rem; color: #E0E0E0; line-height: 1.6; vertical-align: top; white-space: pre-line; }
        tr:hover { background: #1A1A1A; transition: 0.2s; }
        
        .divider-col { border-left: 2px solid #333 !important; }
        .tag-shoe { background:#222; padding:4px 8px; border-radius:4px; font-size:0.75rem; display: inline-block; margin-top: 6px; border: 1px solid #333; }
        .tag-data { font-family: monospace; font-size: 0.95rem; color: #CCC; line-height: 1.8; }
        .data-label { color: var(--sub); font-size: 0.8rem; margin-right: 5px; display: inline-block; width: 35px; }
        
        .summary-box { background: #1A1A1A; padding: 12px 20px; border-radius: 8px; margin-bottom: 15px; display: inline-flex; align-items: center; gap: 15px; }
        .summary-label { color: var(--sub); font-size: 0.95rem; font-weight: bold; }
        .summary-value { font-size: 1.5rem; font-weight: bold; }
        .summary-unit { font-size: 0.9rem; color: var(--sub); font-weight: normal; }

        /* 賽事卡片專用佈局 */
        .race-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
        .race-card { background: #1A1A1A; border-radius: 12px; padding: 20px; position: relative; overflow: hidden; transition: transform 0.2s; border: 1px solid #333; }
        .race-card:hover { transform: translateY(-5px); }
        .tier-badge { position: absolute; top: 0; right: 0; padding: 6px 15px; font-weight: bold; font-size: 0.8rem; border-bottom-left-radius: 12px; }
    </style>
</head>
<body>
    <header><h1 style="font-size: 1.6rem; margin-bottom: 25px;">Lemon | 2026 Marathon Command</h1></header>

    <div class="nav">
        <button id="btn-plans" class="btn active" onclick="switchTab('plans')">🔄 預計與真實雙軌對照</button>
        <button id="btn-races" class="btn" onclick="switchTab('races')">🏆 賽事藍圖與倒數</button>
    </div>
    
    <div id="plans" class="panel active">
        <div class="card">
            <h2>📅 預計 vs 真實 雙軌對照艙</h2>
            <p style="color: var(--sub); font-size: 0.85rem; margin-bottom: 5px;">第一步：選擇訓練月份</p>
            <div id="month-nav" class="sub-nav">載入中...</div>
            
            <div style="display: flex; flex-wrap: wrap; gap: 15px; align-items: stretch; margin: 15px 0;">
                <div id="strategy-box" class="strategy" style="flex: 1; margin: 0;">
                    <h3>訓練戰略大綱</h3><p style="margin: 0; color: var(--sub);">請先點選上方月份...</p>
                </div>
                <div id="month-summary-box" class="summary-box" style="margin: 0; display: none; flex-direction: column; align-items: center; justify-content: center; border-left: 4px solid #FFD700; min-width: 150px;">
                    <span class="summary-label">🏆 當月累積跑量</span>
                    <span id="month-mileage-val" class="summary-value" style="color: #FFD700;">0.00 <span class="summary-unit">km</span></span>
                </div>
            </div>

            <p style="color: var(--sub); font-size: 0.85rem; margin-bottom: 5px; margin-top: 20px;">第二步：選擇週次查看對照表</p>
            <div id="week-nav" class="sub-nav">等待選擇月份...</div>
            <div id="plans-content" class="table-container"></div>
        </div>
    </div>

    <div id="races" class="panel">
        <div class="card">
            <h2>🏆 2026 年度賽事戰情牆</h2>
            <div id="races-content">賽事藍圖載入中...</div>
        </div>
    </div>

    <script>
        const URLS = {
            logs: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRJAGuKrOQuxjDzHvyy9upf0636fKJIy7X3JFGzMquA9x7y6URIaGCv0wqhGObgp364nY9YCuuX6udn/pub?gid=0&single=true&output=csv",
            plans: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRJAGuKrOQuxjDzHvyy9upf0636fKJIy7X3JFGzMquA9x7y6URIaGCv0wqhGObgp364nY9YCuuX6udn/pub?gid=184866247&single=true&output=csv",
            races: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRJAGuKrOQuxjDzHvyy9upf0636fKJIy7X3JFGzMquA9x7y6URIaGCv0wqhGObgp364nY9YCuuX6udn/pub?gid=1066810723&single=true&output=csv"
        };

        const STRATEGY = {
            "6月": "基礎建構期：開發有氧油箱。每週五執行右臀激活，死守足弓外偏防線。",
            "7月": "耐熱築牆期：適應高溫，心率死守在 140bpm 以下。",
            "8月": "強度切換期：半馬專項強度切換，週間加重乳酸閾值跑（Tempo）。",
            "9月": "速度高峰期：內化半馬 4'15\" 目標配速體感。",
            "10月": "賽前減量期：大砍量、守張力，準備 10/31 華航半馬。",
            "11月": "賽事收割期：魔鬼四連賽收割期！全力衝擊田中全馬與 Garmin 半馬。",
            "12月": "賽後修復期：賽後完全拆彈，重建體能基底。"
        };

        let planData = [];
        let logData = [];
        let colKeys = {}; 
        let logKeys = {}; 

        function switchTab(id) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav > .btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('btn-' + id).classList.add('active');
        }

        function formatCellText(text) {
            if (!text) return '';
            return text.trim().replace(/^"|"$/g, '').replace(/\n/g, '<br>');
        }

        Papa.parse(URLS.logs, { 
            download: true, header: true, skipEmptyLines: true,
            complete: res => {
                logData = res.data;
                if (logData.length > 0) {
                    let h = Object.keys(logData[0]);
                    logKeys.date = h.find(k => k.includes('日期'));
                    logKeys.month = h.find(k => k.includes('月'));
                    logKeys.week = h.find(k => k.includes('週') && !k.includes('星'));
                    logKeys.day = h.find(k => k.includes('星'));
                    logKeys.content = h.find(k => k.includes('實際執行') || k.includes('課表'));
                    logKeys.distance = h.find(k => k.includes('里程') || k.includes('距離')); 
                    logKeys.pace = h.find(k => k.includes('配速'));
                    logKeys.hr = h.find(k => k.includes('心率'));
                    logKeys.cadence = h.find(k => k.includes('步頻'));
                    logKeys.memo = h.find(k => k.includes('體感') || k.includes('備註'));
                }
            } 
        });

        // 🌟 賽事資料讀取與卡片渲染
        Papa.parse(URLS.races, { 
            download: true, header: true, skipEmptyLines: true,
            complete: res => renderRaces(res.data, 'races-content') 
        });

        Papa.parse(URLS.plans, { 
            download: true, header: true, skipEmptyLines: true,
            complete: (res) => {
                if (res.data.length === 0) return;
                planData = res.data;
                let headers = Object.keys(planData[0]);
                colKeys.month = headers.find(k => k.includes('月')) || headers[5];
                colKeys.week = headers.find(k => k.includes('週')) || headers[0];
                colKeys.day = headers.find(k => k.includes('星')) || headers[1];
                colKeys.content = headers.find(k => k.includes('課表') || k.includes('跑錶')) || headers[2];
                colKeys.memo = headers.find(k => k.includes('備忘')) || headers[3];
                colKeys.shoe = headers.find(k => k.includes('鞋')) || headers[4];

                let months = ["6月", "7月", "8月", "9月", "10月", "11月", "12月"];
                document.getElementById('month-nav').innerHTML = months.map(m => `<button class="btn" onclick="selectMonth('${m}', this)">${m}</button>`).join('');
            }
        });

        // 🏆 賽事卡片生成邏輯
        function renderRaces(data, id) {
            if(!data || data.length === 0) { document.getElementById(id).innerHTML = "暫無賽事數據"; return; }
            
            let html = '<div class="race-grid">';
            let today = new Date();
            
            data.forEach(r => {
                if(!r['賽事']) return; // 略過空白行
                
                // 解析賽事資料
                let raceDateStr = r['日期'] || '';
                let raceDate = new Date(raceDateStr);
                let raceName = r['賽事'] || '未知賽事';
                let category = r['組別'] || '';
                let target = r['目標成績'] || '完賽';
                let actual = r['成績'] || '';
                let memo = r['備註'] || '';
                let isPB = r['破PB'] ? true : false;
                
                // 判斷賽事級別與顏色
                let tier = (r['賽事級別'] || 'C').toUpperCase();
                let tierColor = tier === 'A' ? 'var(--tier-a)' : (tier === 'B' ? 'var(--tier-b)' : '#666');
                let glow = tier === 'A' ? 'box-shadow: 0 4px 15px rgba(255, 0, 85, 0.2);' : '';
                
                // 計算倒數天數
                let countdownHtml = '';
                let daysLeft = NaN;
                if(raceDateStr) {
                    daysLeft = Math.ceil((raceDate - today) / (1000 * 60 * 60 * 24));
                    if (actual) {
                        countdownHtml = `<div style="color:var(--actual); font-weight:bold; font-size:1.1rem; margin-top:10px;">🏁 賽事已完成</div>`;
                    } else if (daysLeft > 0) {
                        countdownHtml = `<div style="color:${tierColor}; font-weight:bold; font-size:1.4rem; margin-top:10px;">⏳ 倒數 ${daysLeft} 天</div>`;
                    } else if (daysLeft === 0) {
                        countdownHtml = `<div style="color:var(--tier-a); font-weight:bold; font-size:1.4rem; margin-top:10px;">🔥 今天開跑！</div>`;
                    } else {
                        countdownHtml = `<div style="color:#666; font-weight:bold; font-size:1.1rem; margin-top:10px;">🕒 等待成績更新...</div>`;
                    }
                }
                
                // 實際成績區塊
                let resultHtml = '';
                if(actual) {
                    let pbBadge = isPB ? `<span style="background:var(--tier-a); color:white; padding:2px 6px; border-radius:4px; font-size:0.7rem; margin-left:5px;">🔥 破 PB!</span>` : '';
                    resultHtml = `<div style="margin-top:5px; color:var(--actual); font-weight:bold; font-size:1.1rem;">🏆 實際: ${actual} ${pbBadge}</div>`;
                }

                // 產生單張卡片
                html += `
                <div class="race-card" style="border-top: 4px solid ${tierColor}; ${glow}">
                    <div class="tier-badge" style="background:${tierColor}; color:#000;">${tier} 級</div>
                    <h3 style="margin: 0 0 5px 0; font-size: 1.25rem; color: #FFF; padding-right: 40px;">${raceName}</h3>
                    <div style="color: var(--sub); font-size: 0.9rem; margin-bottom: 10px;">
                        <span style="margin-right:10px;">📅 ${raceDateStr}</span> 
                        <span>🏃‍♂️ ${category}</span>
                    </div>
                    ${countdownHtml}
                    <hr style="border: none; border-top: 1px solid #333; margin: 15px 0;">
                    <div>
                        <div style="color: var(--sub); font-size: 0.95rem;">🎯 目標: <span style="color:#FFF;">${target}</span></div>
                        ${resultHtml}
                    </div>
                    ${memo ? `<div style="margin-top:12px; font-size:0.85rem; color:#888; background:#111; padding:8px; border-radius:6px; border-left: 2px solid #444;">${formatCellText(memo)}</div>` : ''}
                </div>
                `;
            });
            html += '</div>';
            document.getElementById(id).innerHTML = html;
        }

        // [以下為原本的課表渲染邏輯，保持不變，略...]
        function selectMonth(m, btn) {
            document.querySelectorAll('#month-nav .btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('strategy-box').innerHTML = `<h3>📅 ${m} 訓練戰略大綱</h3><p style="margin:0; line-height: 1.6;">${STRATEGY[m] || "待規劃"}</p>`;
            
            let monthlyTotalMileage = 0;
            if (logKeys.distance) {
                logData.forEach(l => {
                    if (!l[logKeys.month]) return;
                    let lM = String(l[logKeys.month]).replace(/\s+/g, '');
                    if (lM === m || lM === m.replace('月', '')) {
                        let distValue = parseFloat(String(l[logKeys.distance]).replace(/[^\d.]/g, ''));
                        if (!isNaN(distValue)) monthlyTotalMileage += distValue;
                    }
                });
            }
            
            document.getElementById('month-summary-box').style.display = 'inline-flex';
            document.getElementById('month-mileage-val').innerHTML = `${monthlyTotalMileage.toFixed(2)} <span class="summary-unit">km</span>`;

            let matchedRows = planData.filter(r => {
                let cellVal = String(r[colKeys.month] || '').replace(/\s+/g, '');
                return cellVal === m || cellVal === m.replace('月', '');
            });

            let weeks = [...new Set(matchedRows.map(r => String(r[colKeys.week]).trim()))].filter(w => w && w !== 'undefined' && w !== 'null');
            
            if (weeks.length === 0) {
                document.getElementById('week-nav').innerHTML = "<span style='color:orange;'>⚠️ 這個月在 Excel 裡還沒有輸入課表資料喔！</span>";
                document.getElementById('plans-content').innerHTML = "";
            } else {
                weeks.sort();
                document.getElementById('week-nav').innerHTML = weeks.map(w => `<button class="btn" onclick="renderPlan('${m}','${w}', this)">${w}</button>`).join('');
                renderPlan(m, weeks[0], document.getElementById('week-nav').firstElementChild);
            }
        }

        function renderPlan(m, w, btn) {
            if(btn) {
                document.querySelectorAll('#week-nav .btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            
            let filteredPlan = planData.filter(r => {
                let cellMonth = String(r[colKeys.month] || '').replace(/\s+/g, '');
                let cellWeek = String(r[colKeys.week] || '').trim();
                return (cellMonth === m || cellMonth === m.replace('月', '')) && cellWeek === w;
            });
            
            let weeklyTotalMileage = 0;

            let html = `<table>
                <thead>
                    <tr>
                        <th class="th-expected" style="width: 8%;">星期</th>
                        <th class="th-expected" style="width: 42%;">🎯 預計目標 (課表/戰術/鞋)</th>
                        <th class="th-actual divider-col" style="width: 24%;">✅ 實際執行</th>
                        <th class="th-actual" style="width: 14%;">📊 實際數據</th>
                        <th class="th-actual" style="width: 12%;">📝 體感</th>
                    </tr>
                </thead>
                <tbody>`;

            filteredPlan.forEach(p => {
                let pDay = String(p[colKeys.day]).trim();
                let actualLog = logData.find(l => {
                    if(!l[logKeys.month] || !l[logKeys.week] || !l[logKeys.day]) return false;
                    let lM = String(l[logKeys.month]).replace(/\s+/g, '');
                    let lW = String(l[logKeys.week]).trim();
                    let lD = String(l[logKeys.day]).trim();
                    return (lM === m || lM === m.replace('月', '')) && lW === w && lD === pDay;
                });

                if (actualLog && logKeys.distance && actualLog[logKeys.distance]) {
                    let distValue = parseFloat(String(actualLog[logKeys.distance]).replace(/[^\d.]/g, ''));
                    if (!isNaN(distValue)) {
                        weeklyTotalMileage += distValue;
                    }
                }

                let actDate = (actualLog && actualLog[logKeys.date]) ? `<br><span style="font-size:0.75rem; color:var(--sub)">${actualLog[logKeys.date]}</span>` : '';
                let actContent = actualLog ? `<span style="color:var(--actual); font-weight:bold;">${formatCellText(actualLog[logKeys.content])}</span>` : '<span style="color:#444;">尚未執行</span>';
                
                let actDist = actualLog && actualLog[logKeys.distance] ? actualLog[logKeys.distance] : '-';
                let actPace = actualLog && actualLog[logKeys.pace] ? actualLog[logKeys.pace] : '-';
                let actHR = actualLog && actualLog[logKeys.hr] ? actualLog[logKeys.hr] : '-';
                let actCadence = actualLog && actualLog[logKeys.cadence] ? actualLog[logKeys.cadence] : '-';
                
                let dataStr = actualLog ? 
                    `<div class="tag-data">
                        <span class="data-label">里程:</span><span style="color:#FFD700">${actDist}</span><br>
                        <span class="data-label">配速:</span>${actPace}<br>
                        <span class="data-label">心率:</span>${actHR}<br>
                        <span class="data-label">步頻:</span><span style="color:var(--actual)">${actCadence}</span>
                     </div>` 
                    : '<span style="color:#444;">-</span>';
                
                let actMemo = actualLog ? formatCellText(actualLog[logKeys.memo]) : '<span style="color:#444;">-</span>';

                html += `<tr>
                    <td style="font-weight:bold; color:var(--primary);">${formatCellText(p[colKeys.day])}${actDate}</td>
                    <td>
                        <div style="margin-bottom: 8px;">${formatCellText(p[colKeys.content])}</div>
                        <div style="color:var(--sub); font-size:0.85rem;">💡 ${formatCellText(p[colKeys.memo])}</div>
                        <div class="tag-shoe">👟 ${formatCellText(p[colKeys.shoe]) || '-'}</div>
                    </td>
                    <td class="divider-col" style="background: rgba(0, 230, 118, 0.03);">${actContent}</td>
                    <td style="background: rgba(0, 230, 118, 0.03);">${dataStr}</td>
                    <td style="background: rgba(0, 230, 118, 0.03); font-size:0.85rem;">${actMemo}</td>
                </tr>`;
            });
            
            let summaryPanel = `
                <div class="summary-box" style="border-left: 4px solid var(--actual);">
                    <span class="summary-label">🏃‍♂️ 當週實際總里程</span>
                    <span class="summary-value" style="color: var(--actual);">${weeklyTotalMileage.toFixed(2)} <span class="summary-unit">km</span></span>
                </div>
            `;
            
            document.getElementById('plans-content').innerHTML = summaryPanel + html + '</tbody></table>';
        }
    </script>
</body>
</html>
