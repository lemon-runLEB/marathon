<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Lemon 馬拉松指揮艙</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { background: #0B0B0C; color: #F5F5F7; font-family: sans-serif; padding: 20px; }
        .card { background: #16161A; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #2C2C35; }
        .nav { display: flex; gap: 10px; margin-bottom: 20px; }
        button { background: #333; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        button.active { background: #FF5200; }
        .panel { display: none; }
        .panel.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { padding: 12px; border-bottom: 1px solid #2C2C35; text-align: left; }
        th { color: #FF5200; }
    </style>
</head>
<body>
    <h1>Lemon 馬拉松數據指揮艙</h1>
    <div class="nav">
        <button id="btn-logs" class="active" onclick="switchTab('logs')">訓練日誌</button>
        <button id="btn-plans" onclick="switchTab('plans')">預計課表</button>
        <button id="btn-races" onclick="switchTab('races')">賽事對照</button>
    </div>

    <div id="logs" class="panel active"><div class="card"><h2>真實訓練日誌</h2><div id="logs-content"></div></div></div>
    <div id="plans" class="panel"><div class="card"><h2>每週預計課表</h2><div id="plans-content"></div></div></div>
    <div id="races" class="panel"><div class="card"><h2>賽事對照與反饋</h2><div id="races-content"></div></div></div>

    <script>
        // 這裡填入你三個分頁的獨立 CSV 連結
        const URLS = {
            logs: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRJAGuKrOQuxjDzHvyy9upf0636fKJIy7X3JFGzMquA9x7y6URIaGCv0wqhGObgp364nY9YCuuX6udn/pub?gid=0&single=true&output=csv",
            plans: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRJAGuKrOQuxjDzHvyy9upf0636fKJIy7X3JFGzMquA9x7y6URIaGCv0wqhGObgp364nY9YCuuX6udn/pub?gid=184866247&single=true&output=csv",
            races: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRJAGuKrOQuxjDzHvyy9upf0636fKJIy7X3JFGzMquA9x7y6URIaGCv0wqhGObgp364nY9YCuuX6udn/pub?gid=1066810723&single=true&output=csv"
        };

        function switchTab(id) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('btn-' + id).classList.add('active');
        }

        function load(key) {
            Papa.parse(URLS[key], {
                download: true, header: true,
                complete: function(results) {
                    let html = '<table class="table-style"><thead><tr>';
                    Object.keys(results.data[0]).forEach(k => html += `<th>${k}</th>`);
                    html += '</tr></thead><tbody>';
                    results.data.forEach(row => {
                        html += '<tr>';
                        Object.values(row).forEach(v => html += `<td>${v}</td>`);
                        html += '</tr>';
                    });
                    document.getElementById(key + '-content').innerHTML = html + '</tbody></table>';
                }
            });
        }

        load('logs'); load('plans'); load('races');
    </script>
</body>
</html>
