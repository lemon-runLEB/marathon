<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lemon Marathon Command</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --bg: #050505; --card: #121212; --primary: #FF4500; --actual: #00E676; --tier-a: #FF0055; --tier-b: #FFB300; --text: #FFFFFF; --sub: #A0A0A0; --border: #222222; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; padding: 20px; margin: 0; line-height: 1.5; }
        
        /* 頂部標頭與社群連結佈局 */
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .header-container h1 { margin: 0; font-size: 1.6rem; }
        .social-links { display: flex; gap: 10px; }
        .social-btn { background: #141414; color: #E0E0E0; border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: all 0.3s ease; }
        .ig-btn:hover { color: #FFF; border-color: #E1306C; background: #1C1015; box-shadow: 0 0 12px rgba(225, 48, 108, 0.3); transform: translateY(-2px); }
        .threads-btn:hover { color: #FFF; border-color: #FFFFFF; background: #1C1C1C; box-shadow: 0 0 12px rgba(255, 255, 255, 0.2); transform: translateY(-2px); }

        .nav { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; }
        .btn { background: #1C1C1C; color: var(--sub); border: 1px solid var(--border); padding: 12px 20px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold; font-size: 0.95rem; }
        .btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .sub-nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 0; padding: 10px; background: #0D0D0D; border-radius: 8px; border: 1px solid #1A1A1A; }
        
        .panel { display: none; }
        .panel.active { display: block; }
        .card { background: var(--card); padding: 25px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 20px; }
        
        .strategy { border-left: 4px solid var(--primary); padding: 12px 20px; background: #1A1A1A; color: #EEEEEE; border-radius: 0 8px 8px 0; font-size: 0.95rem; }
        .strategy h3 { margin-top: 0; color: var(--primary); font-size: 1rem; margin-bottom: 5px; }
        
        .table-container { width: 100%; overflow-x: auto; margin-top: 15px; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { font-size: 0.9rem; text-transform: uppercase; padding: 14px 12px; border-bottom: 2px solid #333; text-align: left; background: #16161A; }
        .th-expected { color: var(--primary); border-top: 2px solid var(--primary); }
        .th-actual { color: var(--actual); border-top: 2px solid var(--actual); background: #0A1A10; }
        td { padding: 15px 12px; border-bottom: 1px solid var(--border); font-size: 0.95rem; color: #E0E0E0; line-height: 1.6; vertical-align: top; white-space: pre-line; }
        tr:hover { background: #1A1A1A; transition: 0.2s; }
        
        .divider-col { border-left: 2px solid #333 !important; }
        .tag-shoe { background:#222; padding:4px 8px; border-radius:4px; font-size:0.8rem; display: inline-block; margin-top: 6px; border: 1px solid #333; }
        .tag-data { font-family: monospace; font-size: 1rem; color: #CCC; line-height: 1.8; }
        .data-label { color: var(--sub); font-size: 0.85rem; margin-right: 5px; display: inline-block; width: 35px; }
        
        .summary-box { background: #1A1A1A; padding: 12px 20px; border-radius: 8px; margin-bottom: 15px; display: inline-flex; align-items: center; gap: 15px; }
        .summary-label { color: var(--sub); font-size: 0.95rem; font-weight: bold; }
        .summary-value { font-size: 1.5rem; font-weight: bold; }
        .summary-unit { font-size: 0.9rem; color: var(--sub); font-weight: normal; }

        .race-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
        .race-card { background: #1A1A1A; border-radius: 12px; padding: 20px; position: relative; overflow: hidden; transition: transform 0.2s; border: 1px solid #333; }
        .race-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .tier-badge { position: absolute; top: 0; right: 0; padding: 6px 15px; font-weight: bold; font-size: 0.8rem; border-bottom-left-radius: 12px; }

        /* 📸 高質感瀑布流相片牆 */
        .photo-gallery { column-count: 3; column-gap: 20px; margin-top: 25px; }
        .photo-item { break-inside: avoid; margin-bottom: 20px; border-radius: 16px; overflow: hidden; position: relative; background: #111; border: 1px solid #222; cursor: default; box-shadow: 0 6px 15px rgba(0,0,0,0.6); transition: all 0.4s ease; }
        .photo-item img { width: 100%; height: auto; display: block; object-fit: cover; transition: transform 0.6s ease, filter 0.4s ease; filter: brightness(0.85) grayscale(15%); }
        .photo-item:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(255, 69, 0, 0.15); border-color: var(--primary); }
        .photo-item:hover img { transform: scale(1.05); filter: brightness(1.1) grayscale(0%); }
        .photo-caption { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.6), transparent); color: #fff; font-size: 0.95rem; padding: 35px 20px 20px; font-weight: 500; pointer-events: none; opacity: 0; transform: translateY(15px); transition: all 0.4s ease; }
        .photo-item:hover .photo-caption { opacity: 1; transform: translateY(0); }

        /* 📱 手機版專屬優化 */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .header-container { flex-direction: column; align-items: flex-start; gap: 12px; margin-bottom: 15px; }
            .header-container h1 { font-size: 1.4rem !important; }
            .social-links { width: 100%; gap: 8px; }
            .social-btn { flex: 1; justify-content: center; padding: 10px; font-size: 0.9rem; }
            
            .nav { gap: 8px; margin-bottom: 15px; }
            .nav .btn { flex: 1 1 100%; text-align: center; padding: 14px 10px; font-size: 1rem; }
            .card { padding: 15px; }
            .sub-nav .btn { padding: 10px 15px; font-size: 0.95rem; flex: 1 1 calc(50% - 10px); text-align: center; }
            
            div[style*="display: flex; flex-wrap: wrap;"] { flex-direction: column; }
            .summary-box { width: 100%; box-sizing: border-box; justify-content: center; }
            
            .race-grid { grid-template-columns: 1fr; }
            .photo-gallery { column-count: 2; column-gap: 10px; }
            .photo-item { margin-bottom: 10px; border-radius: 12px; }
            .photo-item img { filter: brightness(1) grayscale(0%); }
            .photo-caption { opacity: 1; transform: translateY(0); padding: 25px 12px 12px; font-size: 0.85rem; }
        }
        
        @media (max-width: 480px) {
            .photo-gallery { column-count: 1; }
        }
    </style>
</head>
<body>
    
    <header class="header-container">
        <h1>Lemon | 2026 Marathon Command</h1>
        <div class="social-links">
            <a href="https://www.instagram.com/lemonleez" target="_blank" class="social-btn ig-btn">📸 Instagram</a>
            <a href="https://www.threads.net/@lemonleez" target="_blank" class="social-btn threads-btn">💬 Threads</a>
        </div>
    </header>

    <div class="nav">
        <button id="btn-plans" class="btn active" onclick="switchTab('plans')">🔄 預計與真實對照</button>
        <button id="btn-races" class="btn" onclick="switchTab('races')">🏆 2026年度賽事戰情牆</button>
        <button id="btn-photos" class="btn" onclick="switchTab('photos')">📸 LEMON訓練相片牆</button>
    </div>
    
    <div id="plans" class="panel active">
        <div class="card">
            <h2>📅 預計課表 vs 真實訓練 雙軌對照</h2>
            <p style="color: var(--sub); font-size: 0.85rem; margin-bottom: 5px;">第一步：選擇訓練月份</p>
            <div id="month-nav" class="sub-nav">載入中...</div>
            
            <div style="display: flex; flex-wrap: wrap; gap: 15px; align-items: stretch; margin: 15px 0;">
                <div id="strategy-box" class="strategy" style="flex: 1; margin: 0;">
                    <h3>訓練戰略大綱</h3><p style="margin: 0; color: var(--sub);">請先點選上方月份...</p>
                </div>
                <div id="month-summary-box" class="summary-box" style="margin: 0; display: none; flex-direction: column; align-items: center; justify-content: center; border-left: 4px solid #FFD700; min-width: 150px;">
                    <span class="summary-label">🏆 當月累積跑量</span>
                    <span id="month-mileage-val" class="summary-value" style="color: #FFD700;">0.00 <span class="summary-unit">km</span></span>
                </div>
            </div>

            <p style="color: var(--sub); font-size: 0.85rem; margin-bottom: 5px; margin-top: 20px;">第二步：選擇週次查看對照表</p>
            <div id="week-nav" class="sub-nav">等待選擇月份...</div>
            <div id="plans-content" class="table-container"></div>
        </div>
    </div>

    <div id="races" class="panel"><div class="card"><h2>🏆 2026 年度賽事戰情牆</h2><div id="races-content" class="table-container">載入中...</div></div></div>

    <div id="photos" class="panel">
        <div class="card">
            <h2>📸 LEMON訓練相片牆</h2>
            <p style="color: var(--sub); margin-bottom: 20px;">來自有訓練的日子..</p>
            <div id="gallery-content" class="photo-gallery">照片載入中...</div>
        </div>
    </div>

    <script>
        const URLS = {
            logs: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRJAGuKrOQuxjDzHvyy9upf0636fKJIy7X3JFGzMquA9x7y6URIaGCv0wqhGObgp364nY9YCuuX6udn/pub?gid=0&single=true&output=csv",
            plans: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRJAGuKrOQuxjDzHvyy9upf0636fKJIy7X3JFGzMquA9x7y6URIaGCv0wqhGObgp364nY9YCuuX6udn/pub?gid=184866247&single=true&output=csv",
            races: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRJAGuKrOQuxjDzHvyy9upf0636fKJIy7X3JFGzMquA9x7y6URIaGCv0wqhGObgp364nY9YCuuX6udn/pub?gid=1066810723&single=true&output=csv",
            gallery: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRJAGuKrOQuxjDzHvyy9upf0636fKJIy7X3JFGzMquA9x7y6URIaGCv0wqhGObgp364nY9YCuuX6udn/pub?gid=1164891801&single=true&output=csv"
        };

        const STRATEGY = {
            "6月": "基礎建構期：擴建有氧大油箱（E 跑）、強化肌腱骨骼防傷剛性、喚醒極速神經（R 跑）。固定執行右臀訓練。",
            "7月": "耐熱築牆期：撐大心臟幫浦（最大攝氧量）、提升高溫下的有氧抗壓能力。",
            "8月": "強度切換期：訓練身體高速清運乳酸的能力（T 跑），正式鎖定半馬 1h30m 的 {4'15''} 配速。",
            "9月": "速度高峰期：訓練身體高速清運乳酸的能力（T 跑），正式鎖定半馬 1h30m 的 {4'15''} 配速。",
            "10月": "賽前減量期：：習慣全馬 2h50m 的配速體感（M 跑），將體能推向年度巔峰。",
            "11月": "賽事收割期：消除前四個月累積的深層疲勞（減量 Taper）、肝醣超補、迎接巔峰狀態！",
            "12月": "賽後修復期：全馬賽後修復、體能保溫。"
        };

        let planData = [], logData = [];
        let colKeys = {}, logKeys = {}; 

        function switchTab(id) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav > .btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('btn-' + id).classList.add('active');
        }

        function formatCellText(text) {
            if (!text) return '';
            return text.trim().replace(/^"|"$/g, '').replace(/\n/g, '<br>');
        }

        function extractUrl(text) {
            if(!text) return null;
            let url = text.trim();
            if(url === '') return null;
            if(!url.startsWith('http')) return url; 
            if (url.includes('github.com') && url.includes('/blob/')) {
                return url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
            }
            return url;
        }

        Papa.parse(URLS.logs, { 
            download: true, header: true, skipEmptyLines: true,
            complete: res => {
                logData = res.data;
                if (logData.length > 0) {
                    let h = Object.keys(logData[0]);
                    logKeys.date = h.find(k => k.includes('日期'));
                    logKeys.month = h.find(k => k.includes('月'));
                    logKeys.week = h.find(k => k.includes('週') && !k.includes('星'));
                    logKeys.day = h.find(k => k.includes('星'));
                    logKeys.content = h.find(k => k.includes('實際執行') || k.includes('課表'));
                    logKeys.distance = h.find(k => k.includes('里程') || k.includes('距離')); 
                    logKeys.pace = h.find(k => k.includes('配速'));
                    logKeys.hr = h.find(k => k.includes('心率'));
                    logKeys.cadence = h.find(k => k.includes('步頻'));
                    logKeys.memo = h.find(k => k.includes('體感') || k.includes('備註'));
                }
            } 
        });

        Papa.parse(URLS.races, { download: true, header: true, skipEmptyLines: true, trimHeaders: true, complete: res => renderRaces(res.data, 'races-content') });
        Papa.parse(URLS.plans, { download: true, header: true, skipEmptyLines: true, complete: (res) => {
            if (res.data.length === 0) return;
            planData = res.data;
            let headers = Object.keys(planData[0]);
            colKeys.month = headers.find(k => k.includes('月')) || headers[5];
            colKeys.week = headers.find(k => k.includes('週')) || headers[0];
            colKeys.day = headers.find(k => k.includes('星')) || headers[1];
            colKeys.content = headers.find(k => k.includes('課表') || k.includes('跑錶')) || headers[2];
            colKeys.memo = headers.find(k => k.includes('備忘')) || headers[3];
            colKeys.shoe = headers.find(k => k.includes('鞋')) || headers[4];
            let months = ["6月", "7月", "8月", "9月", "10月", "11月", "12月"];
            document.getElementById('month-nav').innerHTML = months.map(m => `<button class="btn" onclick="selectMonth('${m}', this)">${m}</button>`).join('');
        }});

        if(URLS.gallery && URLS.gallery.includes('http')) {
            Papa.parse(URLS.gallery, {
                download: true, header: true, skipEmptyLines: true, trimHeaders: true,
                complete: res => {
                    let data = res.data;
                    let container = document.getElementById('gallery-content');
                    if(data.length === 0) { container.innerHTML = "<p style='color:var(--sub)'>請在 Excel 貼上檔名或連結。</p>"; return; }
                    
                    let h = Object.keys(data[0]);
                    let kDesc = h.find(k => k.includes('描述') || k.includes('名稱') || k.includes('文字')) || h[0];
                    let kUrl = h.find(k => k.includes('連結') || k.includes('網址') || k.includes('圖片')) || h[1];

                    let html = '';
                    data.forEach(r => {
                        let originalUrl = r[kUrl];
                        let desc = r[kDesc] || '';
                        let cleanUrl = extractUrl(originalUrl); 
                        
                        if(cleanUrl) {
                            html += `
                                <div class="photo-item">
                                    <img src="${cleanUrl}" alt="Run Photo" loading="lazy" 
                                         onerror="this.onerror=null; this.src='https://placehold.co/600x400/1A1A1A/FF4500?text=404+Error\\nFile+Not+Found';">
                                    <div class="photo-caption">${desc}</div>
                                </div>
                            `;
                        }
                    });
                    container.innerHTML = html !== '' ? html : "<p style='color:var(--sub)'>尚未偵測到有效相片網址或檔名。</p>";
                }
            });
        }

        function renderRaces(data, id) {
            if(!data || data.length === 0) { document.getElementById(id).innerHTML = "<p style='color:var(--sub)'>暫無賽事數據</p>"; return; }
            let h = Object.keys(data[0]);
            let kDate = h.find(k => k.includes('日期')) || h[0];
            let kRace = h.find(k => k.includes('賽事') && !k.includes('級別')) || h[1];
            let kCat = h.find(k => k.includes('組別')) || h[2];
            let kTier = h.find(k => k.includes('級別')) || h[3];
            let kTarget = h.find(k => k.includes('目標')) || h[4];
            let kActual = h.find(k => k.includes('成績') && !k.includes('目標')) || h[5];
            let kPB = h.find(k => k.toUpperCase().includes('PB')) || h[6];
            let kMemo = h.find(k => k.includes('備註')) || h[7];
            let html = '<div class="race-grid">';
            let today = new Date(); today.setHours(0,0,0,0);
            let hasRace = false;
            data.forEach(r => {
                let raceName = r[kRace]; if(!raceName || raceName.trim() === '') return; hasRace = true;
                let raceDateStr = r[kDate] || ''; let raceDate = new Date(raceDateStr);
                let category = r[kCat] || ''; let target = r[kTarget] || '完賽'; let actual = r[kActual] || ''; let memo = r[kMemo] || ''; let isPB = r[kPB] ? true : false;
                let tier = String(r[kTier] || 'C').toUpperCase().trim();
                let tierColor = tier === 'A' ? 'var(--tier-a)' : (tier === 'B' ? 'var(--tier-b)' : '#666');
                let glow = tier === 'A' ? 'box-shadow: 0 4px 15px rgba(255, 0, 85, 0.2);' : '';
                let countdownHtml = '';
                if(actual && actual.trim() !== '') { countdownHtml = `<div style="color:var(--actual); font-weight:bold; font-size:1.1rem; margin-top:10px;">🏁 賽事已完成</div>`; }
                else if(raceDateStr && !isNaN(raceDate)) {
                    let daysLeft = Math.ceil((raceDate.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
                    if (daysLeft > 0) countdownHtml = `<div style="color:${tierColor}; font-weight:bold; font-size:1.4rem; margin-top:10px;">⏳ 倒數 ${daysLeft} 天</div>`;
                    else if (daysLeft === 0) countdownHtml = `<div style="color:var(--tier-a); font-weight:bold; font-size:1.4rem; margin-top:10px;">🔥 今天開跑！</div>`;
                    else countdownHtml = `<div style="color:var(--sub); font-weight:bold; font-size:1.1rem; margin-top:10px;">🕒 待填成績...</div>`;
                }
                let resultHtml = '';
                if(actual && actual.trim() !== '') {
                    let pbBadge = isPB ? `<span style="background:var(--tier-a); color:white; padding:2px 6px; border-radius:4px; font-size:0.7rem; margin-left:5px;">🔥 破 PB!</span>` : '';
                    resultHtml = `<div style="margin-top:5px; color:var(--actual); font-weight:bold; font-size:1.1rem;">🏆 實際: ${actual} ${pbBadge}</div>`;
                }
                html += `<div class="race-card" style="border-top: 4px solid ${tierColor}; ${glow}"><div class="tier-badge" style="background:${tierColor}; color:#000;">${tier} 級</div><h3 style="margin: 0 0 5px 0; font-size: 1.25rem; color: #FFF; padding-right: 40px;">${raceName}</h3><div style="color: var(--sub); font-size: 0.9rem; margin-bottom: 10px;"><span style="margin-right:10px;">📅 ${raceDateStr}</span><span>🏃‍♂️ ${category}</span></div>${countdownHtml}<hr style="border: none; border-top: 1px solid #333; margin: 15px 0;"><div><div style="color: var(--sub); font-size: 0.95rem;">🎯 目標: <span style="color:#FFF;">${target}</span></div>${resultHtml}</div>${memo ? `<div style="margin-top:12px; font-size:0.85rem; color:#888; background:#111; padding:8px; border-radius:6px; border-left: 2px solid #444;">${formatCellText(memo)}</div>` : ''}</div>`;
            });
            html += '</div>';
            if(!hasRace) document.getElementById(id).innerHTML = "<p style='color:var(--sub)'>請確認 Excel 是否有填寫賽事名稱。</p>";
            else document.getElementById(id).innerHTML = html;
        }

        function selectMonth(m, btn) {
            document.querySelectorAll('#month-nav .btn').forEach(b => b.classList.remove('active')); btn.classList.add('active');
            document.getElementById('strategy-box').innerHTML = `<h3>📅 ${m} 訓練戰略大綱</h3><p style="margin:0; line-height: 1.6;">${STRATEGY[m] || "待規劃"}</p>`;
            let monthlyTotalMileage = 0;
            if (logKeys.distance) {
                logData.forEach(l => {
                    if (!l[logKeys.month]) return;
                    let lM = String(l[logKeys.month]).replace(/\s+/g, '');
                    if (lM === m || lM === m.replace('月', '')) {
                        let distValue = parseFloat(String(l[logKeys.distance]).replace(/[^\d.]/g, ''));
                        if (!isNaN(distValue)) monthlyTotalMileage += distValue;
                    }
                });
            }
            document.getElementById('month-summary-box').style.display = 'inline-flex'; document.getElementById('month-mileage-val').innerHTML = `${monthlyTotalMileage.toFixed(2)} <span class="summary-unit">km</span>`;
            let matchedRows = planData.filter(r => { let cellVal = String(r[colKeys.month] || '').replace(/\s+/g, ''); return cellVal === m || cellVal === m.replace('月', ''); });
            let weeks = [...new Set(matchedRows.map(r => String(r[colKeys.week]).trim()))].filter(w => w && w !== 'undefined' && w !== 'null');
            if (weeks.length === 0) { document.getElementById('week-nav').innerHTML = "<span style='color:orange;'>⚠️ 這個月在 Excel 裡還沒有輸入課表資料喔！</span>"; document.getElementById('plans-content').innerHTML = ""; }
            else { weeks.sort(); document.getElementById('week-nav').innerHTML = weeks.map(w => `<button class="btn" onclick="renderPlan('${m}','${w}', this)">${w}</button>`).join(''); renderPlan(m, weeks[0], document.getElementById('week-nav').firstElementChild); }
        }

        function renderPlan(m, w, btn) {
            if(btn) { document.querySelectorAll('#week-nav .btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
            let filteredPlan = planData.filter(r => { let cellMonth = String(r[colKeys.month] || '').replace(/\s+/g, ''); let cellWeek = String(r[colKeys.week] || '').trim(); return (cellMonth === m || cellMonth === m.replace('月', '')) && cellWeek === w; });
            let weeklyTotalMileage = 0;
            let html = `<table><thead><tr><th style="width: 8%;">星期</th><th style="width: 42%;">🎯 預計目標 (課表/戰術/鞋)</th><th class="th-actual divider-col" style="width: 24%;">✅ 實際執行</th><th class="th-actual" style="width: 14%;">📊 實際數據</th><th class="th-actual" style="width: 12%;">📝 體感</th></tr></thead><tbody>`;
            filteredPlan.forEach(p => {
                let pDay = String(p[colKeys.day]).trim();
                let actualLog = logData.find(l => { if(!l[logKeys.month] || !l[logKeys.week] || !l[logKeys.day]) return false; let lM = String(l[logKeys.month]).replace(/\s+/g, ''); let lW = String(l[logKeys.week]).trim(); let lD = String(l[logKeys.day]).trim(); return (lM === m || lM === m.replace('月', '')) && lW === w && lD === pDay; });
                if (actualLog && logKeys.distance && actualLog[logKeys.distance]) { let distValue = parseFloat(String(actualLog[logKeys.distance]).replace(/[^\d.]/g, '')); if (!isNaN(distValue)) weeklyTotalMileage += distValue; }
                let actDate = (actualLog && actualLog[logKeys.date]) ? `<br><span style="font-size:0.75rem; color:var(--sub)">${actualLog[logKeys.date]}</span>` : '';
                let actContent = actualLog ? `<span style="color:var(--actual); font-weight:bold;">${formatCellText(actualLog[logKeys.content])}</span>` : '<span style="color:#444;">尚未執行</span>';
                let actDist = actualLog && actualLog[logKeys.distance] ? actualLog[logKeys.distance] : '-'; let actPace = actualLog && actualLog[logKeys.pace] ? actualLog[logKeys.pace] : '-'; let actHR = actualLog && actualLog[logKeys.hr] ? actualLog[logKeys.hr] : '-'; let actCadence = actualLog && actualLog[logKeys.cadence] ? actualLog[logKeys.cadence] : '-';
                let dataStr = actualLog ? `<div class="tag-data"><span class="data-label">里程:</span><span style="color:#FFD700">${actDist}</span><br><span class="data-label">配速:</span>${actPace}<br><span class="data-label">心率:</span>${actHR}<br><span class="data-label">步頻:</span><span style="color:var(--actual)">${actCadence}</span></div>` : '<span style="color:#444;">-</span>';
                let actMemo = actualLog ? formatCellText(actualLog[logKeys.memo]) : '<span style="color:#444;">-</span>';
                html += `<tr><td style="font-weight:bold; color:var(--primary);">${formatCellText(p[colKeys.day])}${actDate}</td><td><div style="margin-bottom: 8px;">${formatCellText(p[colKeys.content])}</div><div style="color:var(--sub); font-size:0.85rem;">💡 ${formatCellText(p[colKeys.memo])}</div><div class="tag-shoe">👟 ${formatCellText(p[colKeys.shoe]) || '-'}</div></td><td class="divider-col" style="background: rgba(0, 230, 118, 0.03);">${actContent}</td><td style="background: rgba(0, 230, 118, 0.03);">${dataStr}</td><td style="background: rgba(0, 230, 118, 0.03); font-size:0.85rem;">${actMemo}</td></tr>`;
            });
            let summaryPanel = `<div class="summary-box" style="border-left: 4px solid var(--actual);"><span class="summary-label">🏃‍♂️ 當週實際總里程</span><span class="summary-value" style="color: var(--actual);">${weeklyTotalMileage.toFixed(2)} <span class="summary-unit">km</span></span></div>`;
            document.getElementById('plans-content').innerHTML = summaryPanel + html + '</tbody></table>';
        }
    </script>
</body>
</html>
