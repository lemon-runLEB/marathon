<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>除錯模式 - Lemon 指揮艙</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>
    <h1>除錯診斷面板</h1>
    <div id="debug-log" style="color: #FF5200; font-family: monospace;">正在檢查連線...</div>

    <script>
        const PLAN_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRJAGuKrOQuxjDzHvyy9upf0636fKJIy7X3JFGzMquA9x7y6URIaGCv0wqhGObgp364nY9YCuuX6udn/pub?gid=184866247&single=true&output=csv";

        Papa.parse(PLAN_URL, {
            download: true, header: true,
            complete: function(results) {
                const debugDiv = document.getElementById('debug-log');
                if (results.data.length > 0) {
                    const keys = Object.keys(results.data[0]);
                    debugDiv.innerHTML = "✅ 資料抓取成功！<br>發現的欄位名稱有：<br>" + keys.join('、');
                    console.log("資料樣本:", results.data[0]);
                } else {
                    debugDiv.innerHTML = "❌ 抓到資料了但似乎是空的，請檢查 Google Sheets 是否真的有資料？";
                }
            },
            error: function(err) {
                document.getElementById('debug-log').innerHTML = "❌ 連線錯誤: " + err;
            }
        });
    </script>
</body>
</html>
