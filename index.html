<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Lemon Marathon Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { 
            --bg: #050505; --card-bg: #121212; --border: #222222; 
            --primary: #FF4500; --text-main: #FFFFFF; --text-sub: #A0A0A0; 
        }
        body { background: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; padding: 20px; line-height: 1.6; }
        
        /* 導航美化 */
        .nav { display: flex; gap: 15px; margin-bottom: 25px; }
        .btn { background: #1C1C1C; color: var(--text-sub); border: 1px solid var(--border); padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        /* 卡片美化 */
        .card { background: var(--card-bg); padding: 25px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 20px; }
        
        /* 表格美化 */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { color: var(--text-sub); font-size: 0.75rem; text-transform: uppercase; padding: 12px; border-bottom: 1px solid var(--border); text-align: left; }
        td { padding: 15px 12px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        tr:hover { background: #1A1A1A; }

        /* 策略文字 */
        .strategy { border-left: 4px solid var(--primary); padding: 10px 20px; background: #1A1A1A; margin-bottom: 20px; border-radius: 0 8px 8px 0; }
        
        .panel { display: none; }
        .panel.active { display: block; }
    </style>
</head>
<body>
    <header>
        <h1 style="font-size: 1.5rem; margin-bottom: 20px; letter-spacing: -1px;">Lemon | 2026 Marathon Command</h1>
    </header>

    <nav class="nav">
        <button id="btn-logs" class="btn active" onclick="switchTab('logs')">訓練日誌</button>
        <button id="btn-plans" class="btn" onclick="switchTab('plans')">週期課表</button>
        <button id="btn-races" class="btn" onclick="switchTab('races')">賽事對照</button>
    </nav>

    <div id="logs" class="panel active"><div class="card"><h2>訓練日誌</h2><div id="logs-content"></div></div></div>
    
    <div id="plans" class="panel">
        <div class="card">
            <h2>週期化預計課表</h2>
            <div id="month-nav" style="margin-bottom:20px;"></div>
            <div id="strategy-box" class="strategy">請選擇月份以載入戰術大綱...</div>
            <div id="week-nav" style="margin-bottom:20px;"></div>
            <div id="plans-content"></div>
        </div>
    </div>

    <div id="races" class="panel"><div class="card"><h2>賽事藍圖對照</h2><div id="races-content"></div></div></div>

    <script>
        // 你的三個連結
        const URLS = {
            logs: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRJAGuKrOQuxjDzHvyy9upf0636fKJIy7X3JFGzMquA9x7y6URIaGCv0wqhGObgp364nY9YCuuX6udn/pub?gid=0&single=true&output=csv",
            plans: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRJAGuKrOQuxjDzHvyy9upf0636fKJIy7X3JFGzMquA9x7y6URIaGCv0wqhGObgp364nY9YCuuX6udn/pub?gid=184866247&single=true&output=csv",
            races: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRJAGuKrOQuxjDzHvyy9upf0636fKJIy7X3JFGzMquA9x7y6URIaGCv0wqhGObgp364nY9YCuuX6udn/pub?gid=1066810723&single=true&output=csv"
        };
        // (同前述邏輯，放入 render 函數...)
        // [此處省略與先前完全相同的邏輯代碼，你直接覆蓋即可]
    </script>
</body>
</html>
